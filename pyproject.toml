[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xtcli"
version = "0.1.0"
description = "Headless CLI wrapper for xTranslator (Bethesda mod translation tool)"
requires-python = ">=3.11"
dependencies = [
    "pywinauto>=0.6.8",
]

[project.scripts]
xtcli = "xtcli.cli:main"

[tool.setuptools.packages.find]
include = ["xtcli*"]
